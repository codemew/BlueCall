name: Release

# Pushing a version tag (for example v1.0.0) builds the signed release APK,
# runs the unit tests and publishes a GitHub release with the APK attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Set to "false" once a version has been tested on real phones.
  PRERELEASE: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      - name: Check tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "tag=${TAG} versionName=${VERSION}"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match versionName ${VERSION} in app/build.gradle.kts"
            exit 1
          fi

      - name: Test and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BlueCall-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARGS=(--title "BlueCall ${TAG}" --verify-tag)
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "${NOTES}" ]; then ARGS+=(--notes-file "${NOTES}"); else ARGS+=(--generate-notes); fi
          if [ "${PRERELEASE}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${TAG}" dist/* "${ARGS[@]}"

      - name: Keep R8 mapping (for crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
