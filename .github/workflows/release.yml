name: Release

# Publishes a GitHub release with the signed APK for the version in
# app/build.gradle.kts (versionName X.Y.Z -> tag vX.Y.Z). It runs when:
#   - a vX.Y.Z tag is pushed, or
#   - a push changes the release notes or this workflow, or
#   - it is started by hand (Actions > Release > Run workflow).
# If the release for that version already exists, nothing happens. Otherwise the
# unit tests run, the APK is built and signed, and the tag + release are created
# on the commit that triggered the run.
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/release-notes/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Set to "false" once a version has been tested on real phones.
  PRERELEASE: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG="v${VERSION}"
          echo "versionName=${VERSION} tag=${TAG} trigger=${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION}"
            exit 1
          fi
          SKIP=false
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            SKIP=true
          elif [ "${GITHUB_REF_TYPE}" != "tag" ] && [ ! -f ".github/release-notes/${TAG}.md" ]; then
            echo "No .github/release-notes/${TAG}.md yet; not releasing."
            SKIP=true
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        if: steps.version.outputs.skip != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      - name: Test and build release APK
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect release files
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BlueCall-${TAG}.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ARGS=(--title "BlueCall ${TAG}" --target "${GITHUB_SHA}")
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "${NOTES}" ]; then ARGS+=(--notes-file "${NOTES}"); else ARGS+=(--generate-notes); fi
          if [ "${PRERELEASE}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${TAG}" dist/* "${ARGS[@]}"

      - name: Keep R8 mapping (for crash reports)
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.tag }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
